<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Energy Gauges</title>

    <!-- External CSS -->
    <link rel="stylesheet" href="custom.css">

    <!-- JustGage & Raphael.js (Required for Gauges) -->
    <script src="https://cdn.jsdelivr.net/npm/raphael@2.3.0/raphael.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/justgage@1.4.0/justgage.min.js"></script>
    <style>
        body {
            background: transparent;
            text-align: center;
            font-family: Arial, sans-serif;
        }

        .gauge-container {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-top: 50px;
        }

        .gauge-box {
            width: 200px;
        }
    </style>
</head>
<body>

    <h1>Energy Monitoring</h1>

    <div class="gauge-container">
        <div class="gauge-box">
            <div id="gauge1" style="width: 200px; height: 160px;"></div>
            <p>Energy Used</p>
        </div>
        <div class="gauge-box">
            <div id="gauge2" style="width: 200px; height: 160px;"></div>
            <p>Energy Generated</p>
        </div>
    </div>

    
  <script>
    document.addEventListener("DOMContentLoaded", function() {
        // Initialize Gauges
        var gauge1 = new JustGage({
            id: "gauge1",
            value: 0,
            min: 0,
            max: 100,
            title: "Energy Used",
            label: "%",
            levelColors: ["#FF3D00", "#FFA000", "#4CAF50"]
        });

        var gauge2 = new JustGage({
            id: "gauge2",
            value: 0,
            min: 0,
            max: 100,
            title: "Energy Generated",
            label: "%",
            levelColors: ["#FF3D00", "#FFA000", "#4CAF50"]
        });

        // API URLs
        const TOKEN_URL = "https://portal.solaranalytics.com.au/api/v3/token";
        const DATA_URL = "https://portal.solaranalytics.com.au/api/v3/live_site_data?site_id=266722&last_six=false&last_hour=false&battery_data=false";

        // Function to Get Token
        async function getAuthToken() {
            try {
                const response = await fetch(TOKEN_URL, {
                    method: "GET",
                    headers: {
                        "Accept": "application/json"
                    }
                });

                if (!response.ok) throw new Error("Failed to fetch token");

                const data = await response.json();
                return data.token; // Adjust this if the token is stored differently
            } catch (error) {
                console.error("Token fetch error:", error);
                return null;
            }
        }

        // Function to Fetch Energy Data
        async function fetchData() {
            const token = await getAuthToken();

            if (!token) {
                console.error("No token available. Cannot fetch data.");
                return;
            }

            try {
                const response = await fetch(DATA_URL, {
                    method: "GET",
                    headers: {
                        "Accept": "application/json",
                        "Authorization": `Bearer ${token}`
                    }
                });

                if (!response.ok) throw new Error("Failed to fetch data");

                const data = await response.json();

                // Extract values (adjust if API structure is different)
                let energyUsed = data.energy_used || Math.random() * 100; 
                let energyGenerated = data.energy_generated || Math.random() * 100;

                // Update Gauges
                gauge1.refresh(energyUsed);
                gauge2.refresh(energyGenerated);

            } catch (error) {
                console.error("Data fetch error:", error);
            }
        }

        // Fetch Data Every 5 Seconds
        setInterval(fetchData, 5000);

        // Fetch Data on Page Load
        fetchData();
    });
    </script>

</body>
</html>
