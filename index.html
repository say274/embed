<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Energy Gauges</title>

    <!-- External CSS -->
    <link rel="stylesheet" href="custom.css">

    <!-- JustGage & Raphael.js (Required for Gauges) -->
    <script src="https://cdn.jsdelivr.net/npm/raphael@2.3.0/raphael.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/justgage@1.4.0/justgage.min.js"></script>
    <style>
        body {
            background: transparent;
            text-align: center;
            font-family: Arial, sans-serif;
        }

        .gauge-container {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-top: 50px;
        }

        .gauge-box {
            width: 200px;
        }
    </style>
</head>
<body>

    <h1>Energy Monitoring</h1>

    <div class="gauge-container">
        <div class="gauge-box">
            <div id="gauge1" style="width: 200px; height: 160px;"></div>
            <p>Energy Used</p>
        </div>
        <div class="gauge-box">
            <div id="gauge2" style="width: 200px; height: 160px;"></div>
            <p>Energy Generated</p>
        </div>
    </div>

    
  <script>

    document.addEventListener("DOMContentLoaded", function() {
        var gauge1 = new JustGage({
            id: "gauge1",
            value: 0,
            min: 0,
            max: 100,
            title: "Energy Used",
            label: "%",
            levelColors: ["#FF3D00", "#FFA000", "#4CAF50"]
        });

        var gauge2 = new JustGage({
            id: "gauge2",
            value: 0,
            min: 0,
            max: 100,
            title: "Energy Generated",
            label: "%",
            levelColors: ["#FF3D00", "#FFA000", "#4CAF50"]
        });

        // API to get the public token
        const PUBLIC_AUTH_URL = "https://portal.solaranalytics.com.au/api/v3/token";

        async function getPublicToken() {
            const credentials = btoa("public-api@solaranalytics.com:weL0veDa2a!"); // Publicly available
            try {
                const response = await fetch(PUBLIC_AUTH_URL, {
                    method: "GET",
                    headers: {
                        "Accept": "application/json",
                        "Authorization": `Basic ${credentials}`
                    }
                });

                if (!response.ok) throw new Error("Failed to fetch public token");

                const data = await response.json();
                console.log("Public API Token:", data.token);

                // Send public token to your backend to authenticate privately
                fetchBackendData(data.token);

            } catch (error) {
                console.error("Error fetching public token:", error);
            }
        }

        async function fetchBackendData(publicToken) {
            const BACKEND_URL = "https://your-secure-backend.com/get-energy-data";

            try {
                const response = await fetch(BACKEND_URL, {
                    method: "POST",
                    headers: {
                        "Accept": "application/json",
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({ publicToken }) // Send public token to backend
                });

                if (!response.ok) throw new Error("Failed to fetch private energy data");

                const data = await response.json();
                console.log("Energy Data:", data);

                let energyUsed = data.energy_used || Math.random() * 100;
                let energyGenerated = data.energy_generated || Math.random() * 100;

                gauge1.refresh(energyUsed);
                gauge2.refresh(energyGenerated);

            } catch (error) {
                console.error("Error fetching private energy data:", error);
            }
        }

        // Start the process
        getPublicToken();
        setInterval(getPublicToken, 5000); // Refresh every 5 sec
    });

    </script>

</body>
</html>
