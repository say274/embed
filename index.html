<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Energy Gauges</title>

    <!-- External CSS -->
    <link rel="stylesheet" href="custom.css">

    <!-- JustGage & Raphael.js (Required for Gauges) -->
    <script src="https://cdn.jsdelivr.net/npm/raphael"></script>
    <script src="https://cdn.jsdelivr.net/npm/justgage"></script>

    <style>
        body {
            background: transparent;
            text-align: center;
            font-family: Arial, sans-serif;
        }

        .gauge-container {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-top: 50px;
        }

        .gauge-box {
            width: 200px;
        }
    </style>
</head>
<body>

    <h1>Energy Monitoring</h1>

    <div class="gauge-container">
        <div class="gauge-box">
            <div id="gauge1" style="width: 200px; height: 160px;"></div>
            <p>Energy Used</p>
        </div>
        <div class="gauge-box">
            <div id="gauge2" style="width: 200px; height: 160px;"></div>
            <p>Energy Generated</p>
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            var gauge1 = new JustGage({
                id: "gauge1",
                value: 65, // Adjust starting value
                min: 0,
                max: 100,
                title: "",
                label: "%",
                levelColors: ["#FF3D00", "#FFA000", "#4CAF50"]
            });

            var gauge2 = new JustGage({
                id: "gauge2",
                value: 80, // Adjust starting value
                min: 0,
                max: 100,
                title: "",
                label: "%",
                levelColors: ["#FF3D00", "#FFA000", "#4CAF50"]
            });
        });
    </script>

</body>
</html>
