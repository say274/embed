<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Energy Gauges</title>

    <!-- External CSS -->
    <link rel="stylesheet" href="custom.css">

    <!-- JustGage & Raphael.js (Required for Gauges) -->
    <script src="https://cdn.jsdelivr.net/npm/raphael@2.3.0/raphael.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/justgage@1.4.0/justgage.min.js"></script>
    <style>
        body {
            background: transparent;
            text-align: center;
            font-family: Arial, sans-serif;
        }

        .gauge-container {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-top: 50px;
        }

        .gauge-box {
            width: 200px;
        }
    </style>
</head>
<body>

    <h1>Energy Monitoring</h1>

    <div class="gauge-container">
        <div class="gauge-box">
            <div id="gauge1" style="width: 200px; height: 160px;"></div>
            <p>Energy Used</p>
        </div>
        <div class="gauge-box">
            <div id="gauge2" style="width: 200px; height: 160px;"></div>
            <p>Energy Generated</p>
        </div>
    </div>

    
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            // Initialize Gauges
            var gauge1 = new JustGage({
                id: "gauge1",
                value: 0, // Initial Value
                min: 0,
                max: 100,
                title: "Energy Used",
                label: "%",
                levelColors: ["#FF3D00", "#FFA000", "#4CAF50"]
            });
    
            var gauge2 = new JustGage({
                id: "gauge2",
                value: 0, // Initial Value
                min: 0,
                max: 100,
                title: "Energy Generated",
                label: "%",
                levelColors: ["#FF3D00", "#FFA000", "#4CAF50"]
            });
    
            // Function to Fetch Data
            function fetchData() {
                fetch("https://portal.solaranalytics.com.au/api/v3/live_site_data?site_id=266722&last_six=false&last_hour=false&battery_data=false
")
                    .then(response => response.json()) // Convert response to JSON
                    .then(data => {
                        // Assume API returns { energy_used: 65, energy_generated: 80 }
                        gauge1.refresh(data.energy_used);
                        gauge2.refresh(data.energy_generated);
                    })
                    .catch(error => console.error("Error fetching data:", error));
            }
    
            // Fetch Data Every 5 Seconds
            setInterval(fetchData, 30000);
    
            // Fetch Data on Page Load
            fetchData();
        });
    </script>

</body>
</html>
